
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queueease-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queueease-backend
  template:
    metadata:
      labels:
        app: queueease-backend
    spec:
      containers:
        - name: backend
          image: queueease-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: queueease-backend
spec:
  type: NodePort
  selector:
    app: queueease-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
