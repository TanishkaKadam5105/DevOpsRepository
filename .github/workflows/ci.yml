
name: QueueEase CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build backend Docker image
        run: docker build -t queueease-backend:latest ./queueease/docker/backend

      - name: Build frontend Docker image
        run: docker build -t queueease-frontend:latest ./queueease/docker/frontend
